name: Deploy platform to K8s

# platform dalı: yalnızca magickiosk namespace'ine dokunur; main workflow'u ve magiccoffee namespace'i etkilenmez.
on:
  push:
    branches:
      - platform
  workflow_dispatch:

concurrency:
  group: magickiosk-api-deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: magickiosk

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          pip install -r requirements.txt pytest
          python -m pytest -q

  build-and-deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set image name
        run: echo "IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/magickiosk-api:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}

      - uses: azure/setup-kubectl@v3
        with:
          version: 'v1.29.0'

      - name: Set up kubeconfig
        env:
          # Secret KUBECONFIG ya da KUBECONFIG_DEV adıyla, düz metin veya base64 olarak eklenebilir.
          KUBECONFIG_CONTENT: ${{ secrets.KUBECONFIG || secrets.KUBECONFIG_DEV }}
        run: |
          if [ -z "$KUBECONFIG_CONTENT" ]; then
            echo "::error::KUBECONFIG (veya KUBECONFIG_DEV) secret'ı bu repoda tanımlı değil ya da boş."
            exit 1
          fi
          mkdir -p "$HOME/.kube"
          if printf '%s' "$KUBECONFIG_CONTENT" | grep -q 'apiVersion'; then
            printf '%s\n' "$KUBECONFIG_CONTENT" > "$HOME/.kube/config"
          else
            printf '%s' "$KUBECONFIG_CONTENT" | base64 -d > "$HOME/.kube/config"
          fi
          chmod 600 "$HOME/.kube/config"
          # Erişim doğrulanamazsa kurulum burada açık bir hatayla durur.
          kubectl get ns "$NAMESPACE" -o name

      - name: Ensure namespace, pull secret and app secret
        run: |
          kubectl create secret docker-registry dockerhub -n "$NAMESPACE" \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username="${{ secrets.DOCKERHUB_USERNAME }}" \
            --docker-password="${{ secrets.DOCKERHUB_TOKEN }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          # DATABASE_URL ve CASPRO_API_KEY kümede elle tutulur; yoksa kurulum durur.
          kubectl get secret magickiosk-api-secrets -n "$NAMESPACE" >/dev/null

      - name: Deploy
        run: |
          kubectl apply -n "$NAMESPACE" -f k8s/platform/pvc.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/platform/networkpolicy.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/platform/service.yaml
          kubectl apply -n "$NAMESPACE" -f k8s/platform/ingress.yaml
          sed "s|IMAGE_PLACEHOLDER|${IMAGE}|g" k8s/platform/deployment.yaml | kubectl apply -n "$NAMESPACE" -f -
          kubectl rollout status -n "$NAMESPACE" deployment/magickiosk-api --timeout=240s
