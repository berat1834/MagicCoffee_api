[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "magicpay-vending-bridge"
dynamic = ["version"]
description = "MagicPay Kiosk kahve otomati MDB koprusu (Raspberry Pi + Qibixx MDB Pi HAT / MDB-USB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "pyserial>=3.5,<4",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vending-bridge = "vending_bridge.__main__:main"

[tool.setuptools]
packages = ["vending_bridge"]

[tool.setuptools.dynamic]
version = { attr = "vending_bridge.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
