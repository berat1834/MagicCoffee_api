services:
  - type: web
    name: magiccoffee-api
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_ALLOWED_HOST
        value: pg-39595717-beratbaylan123-9802.j.aivencloud.com
      - key: ALLOWED_ORIGINS
        value: https://magiccoffee-panel.onrender.com,https://magiccoffee-ui.onrender.com,http://localhost:5370,http://127.0.0.1:5370,http://localhost:5371,http://127.0.0.1:5371
      - key: PAVO_GATEWAY_BASE_URL
        value: https://kebo-api-dev.magicpay.ai/api
      - key: PAVO_GATEWAY_ALLOWED_HOST
        value: kebo-api-dev.magicpay.ai
      - key: PAVO_BRANCH_ID
        value: "2"
      - key: PAVO_TERMINAL_SERIAL
        value: PAV960000010
      - key: PAVO_SOURCE_FINGERPRINT
        value: TEST
      - key: PAVO_PROVIDER_TYPE
        value: PAVO_CLOUD
      - key: PAVO_GATEWAY_SERVICE_EMAIL
        value: magiccoffee-pos@internal.magicpay.ai
      - key: PAVO_GATEWAY_SERVICE_PASSWORD
        sync: false
      - key: GOOGLE_TRANSLATE_API_KEY
        sync: false
